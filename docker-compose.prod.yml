services:
  api:
    build: ./Aura
    env_file:
      - ./Aura/.env
    volumes:
      - aura-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./Aura/frontend
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aura-data: